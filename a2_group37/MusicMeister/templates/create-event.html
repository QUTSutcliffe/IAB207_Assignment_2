{% extends "base.html" %}
{% from "bootstrap5/form.html" import render_form %}

{% block styles %}
{% endblock %}

{% block content %}
<main class="container my-5">
        <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary mb-4">
            Back to Events
        </a>
        <div class="row g-5">
            <div class="col-12 col-lg-6">
                <img src="./static/img/band.jpg" class="img-fluid rounded shadow w-100"
                    alt="Your Image">
            </div>
            <div class="col-12 col-lg-6 user-form">
                {{ render_form(form) }}
            </div>
        </div>

        </section>
    </main>

    <div class="modal fade" id="updateModal" tabindex="-1" aria-labelledby="updateModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="updateModalLabel">Creation Confirmed </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"> </button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-success">Your event was created successfully!</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Close </button>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Go Home</a>
                </div>
            </div>
        </div>
    </div>
   {% endblock %}
